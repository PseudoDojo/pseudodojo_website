<!DOCTYPE html>
<!--[if IE 7]>
<html class="ie ie7" lang="en-US">
<![endif]-->
<!--[if IE 8]>
<html class="ie ie8" lang="en-US">

<!--[if !(IE 7) | !(IE 8)  ]><!-->
<html lang="en-US">
<!--<![endif]-->

<head>
  <title>PseudoDojo</title>

  <!-- Meta characteristics -->
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1360">
  <meta name="description" content="This site provides tested pseudopotentials, which are sorted by type, accuracy, and efficiency. It shows information on the convergence, quality, and transferability of the pseudos, which are downloadable in formats compatible with QuantumESPRESSO, Abinit, and more." />
  <meta name="keywords" content="pseudopotential, pseudo, DFT, ionic, valence, frozen core, PAW atomic dataset, periodic table, elements, ab initio, norm conserving, plane wave, PAW, Vanderbilt, JTH, NC, fully relativistic, scalar relativistic" />
  <meta name="robots" content="index, follow" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="The Periodic Table of tested pseudopotentials" />
  <meta property="og:url" content="http://pseudo-dojo.org" />
  <meta property="og:description" content="This site provides tested pseudopotentials, which are sorted by type, accuracy, and efficiency. It shows information on the convergence, quality, and transferability of the pseudos, which are downloadable in formats compatible with QuantumESPRESSO, Abinit, and more." />

  <!-- Links to stylesheets, scripts, and images -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <link rel="icon" type="image/x-icon" href="/img/favicon.png">
  <script src="js/dojo-tools.js"></script>

  <!-- Toastify -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Guided Tour -->
  <link rel="stylesheet" href="/css/shepherd.css">
  <script src="/js/shepherd.min.js"></script>

</head>

<body> <!-- Includes background image (light grey logo and white lines) styled in CSS -->

  <!-- Main menu, top right -->
  <nav class="menubar" aria-label="Main menu">
    <div class="menutext">
        <button tabindex=3 class="menuitem" onclick="window.location = 'about.html'" aria-label="Go to About page">About</button>
        <button tabindex=4 class="menuitem" onclick="window.location = 'faq.html'" aria-label="Go to F.A.Q. page">F.A.Q.</button>
        <button tabindex=5 class="menuitem" onclick="window.location = 'contribute.html'" aria-label="Go to Contribute page">Contribute</button>
    </div>
  </nav>

  <!-- Warning box -->
  <div id="warning_box" aria-label="Warning box"></div>

  <!-- Intro Stuff (Logo, selectors, etc.) -->
  <div class="intro">
    <!-- Pseudo Dojo Logo -->
    <a role="button" tabindex=1 aria-label="PseudoDojo logo and link to YouTube song. PseudoDojo is written in blocky font with horizontal lines over each o." href="https://youtu.be/j9z4AJIx40M" target="_blank" title="The Pseudo Dojo">
      <img src="../img/logo.svg" class="logo hide" alt="PseudoDojo logo text, where PseudoDojo is written in blocky font with horizontal lines over each o.">
    </a>

    <!-- Large Arrow -->
    <div class="arrow" id="MainArrow" aria-label="Big arrow pointing to periodic table">
      <img src="../img/arrow.svg" class="arrow" alt="">
    </div>

    <!-- Quick Tutorial button -->
    <button tabindex=2 class="help_button" onclick="dojoTour_guidedtour()" id="guided-tour-button" title="Guided Tour" aria-label="Guided tour">
      Quick Tutorial
    </button>

    <!-- Toggle for Download Mode or Testing Mode -->
    <div tabindex=0 class="mode-wrapper" id="DojoMode">
      <span id="modeLegend" class="toggle-label">
        Click on an element to:
      </span>

      <fieldset class="mode-group" aria-labelledby="modeLegend">
        <label class="mode-option">
          <input type="radio" name="dojoMode" id="downloadMode" value="Download pseudo mode" checked>
            Download pseudos
        </label>

        <label class="mode-option">
          <input type="radio" name="dojoMode" id="validationMode" value="See test result mode">
          See test results
        </label>
      </fieldset>

    </div>

    <!-- Pseudo selection bar -->
    <div id="selectorStatus" class="sr-only" aria-live="polite"></div>
    <div class="selection_bar" aria-label="Options for pseudopotential characteristics bar">

      <!-- Selection of TYPE -->
      <div class="selector">
        <label for="TYPE">Type:</label>
        <select id="TYPE"></select>
      </div>

      <!-- Selection of RELATIVISTIC -->
      <div class="selector">
        <label for="REL">Relativistic:</label>
        <select id="REL" style="width: 75px;"></select>
      </div>

      <!-- Selection of VERSION -->
      <div class="selector">
        <label for="VER">Version:</label>
        <select id="VER" style="width: 60px;"></select>
      </div>

      <!-- Selection of XC functional -->
      <div class="selector">
        <label for="XC">XC:</label>
        <select id="XC" style="width: 80px;"></select>
      </div>

      <!-- Selection of ACCURACY -->
      <div class="selector">
        <label for="ACC">Accuracy:</label>
        <select id="ACC" style="width: 100px;">
        </select>
      </div>

      <!-- Selection of FORMAT -->
      <div class="selector">
        <label for="FMT">Format:</label>
        <select id="FMT" style="width: 75px;"></select>
      </div>

    </div>

    <!-- Citation box -->
    <div id="citebox" class="citation_box" role="button" tabindex="0" aria-label="Copy Chicago citations to clipboard"></div>

  </div>

  <!-- Citation copied to clipboard flag -->
  <div id="citation-toast" class="citation-toast">
    <span class="toast-check">✓</span>
    Chicago-style citations copied to clipboard
  </div>

  <!-- Wrapper for primary functionality of website -->
  <div class="wrapper">
    <div class="table">

      <!-- Periodic table rendering -->
      <div id="periodic-table" aria-label="Periodic table"></div>

      <!-- Detail box at bottom left of screen -->
      <div class="detail-wrap" aria-label="Details on each element when hovered or focused">
        <div class="detail" id="X_n">
          <div class="zee" id="X_z" aria-label="atomic number">Z</div>
          <div class="valence" id="X_nv" aria-label="number of valence electrons">#</div>
          <div class="levels" id="LEVS">
            <div id="X_hl" aria-label="low energy cutoff suggestion">low</div>
            <div id="X_hn" aria-label="middle energy cutoff suggestion">middle</div>
            <div id="X_hh" aria-label="high energy cutoff suggestion">high</div>
          </div>

          <div class="element" id="X_el" aria-label="element symbol">X</div>
          <div class="name" id="X_name" aria-label="element name">element name</div>
        </div>

        <!-- Labels -->
        <div class="label label-z">atomic number</div>
        <div class="label label-nv">number of valence orbitals</div>
        <div class="label label-ecut">e<sub>cut</sub> hints</div>

        <!-- Squiggles -->
        <img class="squiggles atnum" src="../img/z_squiggle.svg" alt=""></img>
        <img class="squiggles bracket" src="../img/bracket.svg" alt=""></img>
        <img class="squiggles vale" src="../img/nv_squiggle.svg" alt=""></img>
      </div>

      <!-- Preset button: currently highlighting new table with lanthanide pseudos -->
      <button id="preset-btn" class="preset-button" aria-label="Selector presets for the new lanthanides">
        New Lanthanides
        <img class="eclat" src="./img/eclat.svg" alt="New"></img>
      </button>

      <!-- Download Table button -->
      <div id="download_button" class="download_button" role="button" tabindex="0" aria-label="download the entire table">Download Table</div>

    </div>

  </div>

  <script>
      document.addEventListener("DOMContentLoaded", function() {
      // this function runs when the DOM is ready, i.e., when the document has been parsed
      dojo_start();
  });
  </script>

</body>

</html>
